version: 0.2

env:
  variables:
    AWS_REGION: us-east-1

phases:
  pre_build:
    commands:
      - echo "Pre-build - Environment=$ENVIRONMENT  Bucket=$ARTIFACT_BUCKET"
      - pip install -q aws-sam-cli
      - sam --version
      - cd clinic-crm && npm ci --quiet

  build:
    commands:
      - cd clinic-crm && npm run build
      - cd clinic-crm && npm run sam:build
      - cd clinic-crm && sam package --template-file .aws-sam/build/template.yaml --s3-bucket $ARTIFACT_BUCKET --output-template-file packaged.yaml --region $AWS_REGION

  post_build:
    commands:
      - echo "Build complete"

artifacts:
  files:
    - clinic-crm/packaged.yaml
    - clinic-crm/out/**/*
  discard-paths: no

cache:
  paths:
    - clinic-crm/node_modules/**/*
    - /root/.cache/pip/**/*
