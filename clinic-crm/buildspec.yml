version: 0.2

env:
  variables:
    AWS_REGION: us-east-1

phases:
  pre_build:
    commands:
      - echo "=== pre_build ==="
      - pip install -q aws-sam-cli
      - sam --version
      - cd $CODEBUILD_SRC_DIR/clinic-crm && npm ci --quiet

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/clinic-crm && npm run build
      - cd $CODEBUILD_SRC_DIR/clinic-crm && npm run sam:build
      - cd $CODEBUILD_SRC_DIR/clinic-crm && sam package --template-file .aws-sam/build/template.yaml --s3-bucket $ARTIFACT_BUCKET --output-template-file packaged.yaml --region $AWS_REGION

  post_build:
    commands:
      - echo "=== done ==="

artifacts:
  files:
    - clinic-crm/packaged.yaml
    - clinic-crm/out/**/*
  base-directory: $CODEBUILD_SRC_DIR
  discard-paths: no

cache:
  paths:
    - clinic-crm/node_modules/**/*
    - /root/.cache/pip/**/*
